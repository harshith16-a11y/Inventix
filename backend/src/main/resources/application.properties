spring.application.name=smart-warehouse-optimizer
server.port=${PORT:8080}

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:warehousedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration (Min 256 bits secret)
jwt.secret=WarehouseInventoryOptimizerSecretKeyCollegeReview3DSAProject2026SecureKey!
jwt.expirationMs=86400000

# Logging
logging.level.com.smartwarehouse=INFO
logging.level.org.springframework.security=WARN
